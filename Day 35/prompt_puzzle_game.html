<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg1:#0b0f1a; --bg2:#121a2b; --panel:#151d30; --panel2:#1b2540;
    --accent:#7c5cff; --accent2:#37e0d0; --warn:#ffb84d; --bad:#ff5d7a; --good:#4ade80;
    --text:#e8ecff; --muted:#8b93b8; --border:#2a3554;
    --shadow: 0 10px 40px rgba(0,0,0,.45);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; color:var(--text);
    background: radial-gradient(1200px 800px at 10% -10%, #1c2444 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 10%, #1a3b3a 0%, transparent 55%),
                linear-gradient(180deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
  }
  #app{max-width:1100px;margin:0 auto;padding:24px 16px 80px;}
  .header{
    text-align:center; padding:26px 20px; border-radius:20px;
    background:linear-gradient(135deg, rgba(124,92,255,.18), rgba(55,224,208,.10));
    border:1px solid var(--border); box-shadow:var(--shadow); margin-bottom:22px;
  }
  .header h1{margin:0 0 6px; font-size:1.8rem; letter-spacing:.3px;}
  .header p{margin:0;color:var(--muted);font-size:.95rem;}
  .card{
    background:linear-gradient(180deg, var(--panel), var(--panel2));
    border:1px solid var(--border); border-radius:18px; padding:20px;
    box-shadow:var(--shadow); margin-bottom:18px;
  }
  .btn{
    cursor:pointer; border:none; border-radius:12px; padding:12px 20px;
    font-weight:600; font-size:.92rem; color:#0b0f1a;
    background:linear-gradient(135deg, var(--accent2), var(--accent));
    transition: transform .15s ease, box-shadow .15s ease; box-shadow:0 4px 14px rgba(124,92,255,.35);
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(124,92,255,.5);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border); box-shadow:none;}
  .btn.secondary:hover{border-color:var(--accent2);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.4px;}
  .pill.domain{background:rgba(124,92,255,.2);color:#c9bdff;border:1px solid rgba(124,92,255,.4);}
  .pill.diff{background:rgba(255,184,77,.15);color:var(--warn);border:1px solid rgba(255,184,77,.4);}
  select, input[type=text]{
    background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:10px 14px; font-size:.9rem;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .space-between{justify-content:space-between;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:800px){.grid{grid-template-columns:1fr;}}
  .statbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .stat{
    flex:1;min-width:110px;background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:12px;padding:10px 14px;text-align:center;
  }
  .stat .num{font-size:1.3rem;font-weight:800;color:var(--accent2);}
  .stat .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .progress-outer{height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin:10px 0 18px;}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .4s ease;}
  h2{margin:0 0 6px;font-size:1.25rem;}
  h3{margin:18px 0 8px;font-size:1rem;color:var(--accent2);}
  .muted{color:var(--muted);font-size:.85rem;}
  .output-box{
    background:#0d1220;border:1px solid var(--border);border-radius:12px;padding:14px 16px;
    font-family:'Consolas','Courier New',monospace;font-size:.85rem;white-space:pre-wrap;line-height:1.5;
  }
  .blocks-zone{
    min-height:70px;border:2px dashed var(--border);border-radius:14px;padding:12px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;transition:border-color .2s, background .2s;
  }
  .blocks-zone.over{border-color:var(--accent2);background:rgba(55,224,208,.06);}
  .block{
    background:linear-gradient(135deg,#232d4d,#1b2540); border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;cursor:grab;font-size:.85rem;user-select:none;
    transition:transform .15s, box-shadow .15s, border-color .15s;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .block:hover{transform:translateY(-2px);border-color:var(--accent2);}
  .block.dragging{opacity:.4;}
  .block.correct-flash{border-color:var(--good) !important; box-shadow:0 0 14px rgba(74,222,128,.5);}
  .block.wrong-flash{border-color:var(--bad) !important; box-shadow:0 0 14px rgba(255,93,122,.5); animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .choice-card{
    border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
    background:rgba(255,255,255,.02); transition:border-color .2s, background .2s, transform .15s;
  }
  .choice-card:hover{border-color:var(--accent2);transform:translateX(4px);}
  .choice-card.selected{border-color:var(--accent);background:rgba(124,92,255,.1);}
  .choice-card.correct{border-color:var(--good);background:rgba(74,222,128,.08);}
  .choice-card.incorrect{border-color:var(--bad);background:rgba(255,93,122,.08);}
  .tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(124,92,255,.2);color:#c9bdff;margin-right:6px;}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:10px;}
  .toast{
    background:linear-gradient(135deg,#1b2540,#232d4d);border:1px solid var(--accent2);border-radius:12px;
    padding:12px 18px;box-shadow:var(--shadow);font-size:.85rem;min-width:220px;
    animation:slidein .3s ease, fadeout .4s ease 2.4s forwards;
  }
  .toast.bad{border-color:var(--bad);}
  @keyframes slidein{from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes fadeout{to{opacity:0;transform:translateX(30px);}}
  .score-pop{
    position:fixed;font-weight:800;font-size:1.4rem;color:var(--good);pointer-events:none;z-index:998;
    animation:popup 1s ease forwards;
  }
  @keyframes popup{0%{opacity:0;transform:translateY(0) scale(.7);}20%{opacity:1;transform:translateY(-10px) scale(1.1);}100%{opacity:0;transform:translateY(-60px) scale(1);}}
  .dna-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:10px 0;}
  .dna-seg{display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#0b0f1a;}
  .report-hero{text-align:center;padding:24px;}
  .report-hero .rank{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .footer-nav{display:flex;justify-content:space-between;margin-top:18px;}
  .hint-box{background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.35);border-radius:10px;padding:10px 14px;font-size:.85rem;margin-top:10px;}
  .fade-in{animation:fadein .4s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  a{color:var(--accent2);}
  .small{font-size:.75rem;color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================= DATA ============================= */
const DOMAIN = "Software/Coding";
const DIFFICULTY = "Intermediate";

// Reusable scenario objects
const SCENARIOS = [
  {
    id: 1,
    title: "Refactor a Legacy Function",
    desiredOutput: "A cleanly refactored JavaScript function with improved readability, error handling, and inline comments explaining changes.",
    correctBlocks: [
      "Refactor the following JavaScript function for readability and maintainability.",
      "Add proper error handling using try/catch.",
      "Preserve the original function's behavior and signature.",
      "Add concise inline comments explaining each change."
    ],
    distractorBlocks: [
      "Make the code as short as possible, even if unreadable.",
      "Rewrite the entire app architecture from scratch.",
      "Ignore edge cases to save time."
    ],
    weakPrompt: "Fix this code.",
    optimizedPrompt: "Refactor the following JavaScript function for readability and maintainability. Add proper error handling using try/catch, preserve the original function's behavior and signature, and add concise inline comments explaining each change.",
    overEngineeredPrompt: "As the world's most elite 10x principal staff software engineer with 30 years of FAANG experience, meticulously refactor this function across every conceivable dimension including but not limited to readability, maintainability, testability, performance, security, scalability, accessibility, internationalization, and future-proofing, providing exhaustive justification for every single character changed, formatted as a 10-section report with executive summary.",
    weakOutput: "function process(x){ if(x) return x*2; }  // fixed it",
    optimizedOutput: "// Refactored: added input validation and error handling\nfunction processValue(x) {\n  try {\n    if (typeof x !== 'number') throw new Error('Input must be a number');\n    return x * 2;\n  } catch (err) {\n    console.error('processValue failed:', err.message);\n    return null;\n  }\n}",
    principle: "Specificity + Constraints: Naming the exact transformation (readability, error handling, comments) while preserving behavior gives the model a clear, bounded target — avoiding both vague fixes and runaway scope."
  },
  {
    id: 2,
    title: "Generate Unit Tests",
    desiredOutput: "A focused set of unit tests covering normal, edge, and error cases for a given function, using a specified testing framework.",
    correctBlocks: [
      "Write unit tests for the following function using Jest.",
      "Cover normal cases, edge cases, and error/invalid input cases.",
      "Use descriptive test names that explain what is being verified.",
      "Return only the test code, no explanation."
    ],
    distractorBlocks: [
      "Write tests for every possible framework just in case.",
      "Make the tests pass regardless of correctness.",
      "Include unrelated integration and load tests."
    ],
    weakPrompt: "Write tests for this function.",
    optimizedPrompt: "Write unit tests for the following function using Jest. Cover normal cases, edge cases, and error/invalid input cases. Use descriptive test names that explain what is being verified. Return only the test code, no explanation.",
    overEngineeredPrompt: "Acting as a world-class QA architect, generate an exhaustive, enterprise-grade test suite covering every testing framework (Jest, Mocha, Jasmine, Vitest, AVA), including unit, integration, snapshot, mutation, property-based, and fuzz testing, with full CI/CD pipeline YAML configs, coverage badges, and a 500-word rationale for each assertion.",
    weakOutput: "test('works', () => { expect(fn(2)).toBe(4); });",
    optimizedOutput: "describe('divide()', () => {\n  test('divides two positive numbers correctly', () => {\n    expect(divide(10, 2)).toBe(5);\n  });\n  test('returns Infinity when dividing by zero with positive numerator', () => {\n    expect(divide(5, 0)).toBe(Infinity);\n  });\n  test('throws error when input is not a number', () => {\n    expect(() => divide('a', 2)).toThrow();\n  });\n});",
    principle: "Framework + Coverage Scope: Specifying the exact framework and the categories of cases (normal/edge/error) prevents shallow, single-assertion tests and unnecessary framework sprawl."
  },
  {
    id: 3,
    title: "Explain a Bug to a Junior Dev",
    desiredOutput: "A clear, beginner-friendly explanation of a bug's root cause and fix, without unnecessary jargon.",
    correctBlocks: [
      "Explain this bug to a junior developer in simple terms.",
      "Describe the root cause first, then the fix.",
      "Avoid unnecessary jargon; define any technical term you must use.",
      "Keep the explanation under 150 words."
    ],
    distractorBlocks: [
      "Use as much advanced terminology as possible to sound impressive.",
      "Skip the root cause and just give the fixed code.",
      "Write a full computer science lecture on the topic."
    ],
    weakPrompt: "Why is this broken?",
    optimizedPrompt: "Explain this bug to a junior developer in simple terms. Describe the root cause first, then the fix. Avoid unnecessary jargon; define any technical term you must use. Keep the explanation under 150 words.",
    overEngineeredPrompt: "As a distinguished computer science professor emeritus, deliver a comprehensive doctoral-level lecture covering the full theoretical underpinnings of this bug including memory models, the ECMAScript specification, historical language design decisions, and philosophical implications of asynchronous programming, spanning at least 2000 words with citations.",
    weakOutput: "It's a closure issue. Fix the scope.",
    optimizedOutput: "The bug happens because the loop variable is shared across all iterations instead of being unique to each one. So when your callback runs later, it sees the final value, not the one from its own loop turn. Fix: use 'let' instead of 'var' in the loop declaration — this gives each iteration its own separate variable.",
    principle: "Audience Framing: Defining the reader ('junior developer') and a length cap forces the model to calibrate tone and depth, preventing both cryptic one-liners and academic over-explanation."
  },
  {
    id: 4,
    title: "Design a REST API Endpoint",
    desiredOutput: "A well-structured REST endpoint specification including method, path, request/response schema, and error codes.",
    correctBlocks: [
      "Design a REST API endpoint for creating a new user account.",
      "Specify the HTTP method, URL path, request body schema, and response schema.",
      "Include relevant error status codes with brief descriptions.",
      "Follow standard REST naming conventions."
    ],
    distractorBlocks: [
      "Design endpoints for the entire application at once.",
      "Use non-standard HTTP verbs for creativity.",
      "Skip error handling since it's optional."
    ],
    weakPrompt: "Make an API for users.",
    optimizedPrompt: "Design a REST API endpoint for creating a new user account. Specify the HTTP method, URL path, request body schema, and response schema. Include relevant error status codes with brief descriptions. Follow standard REST naming conventions.",
    overEngineeredPrompt: "As a principal API architect designing for a billion-user global-scale distributed microservices ecosystem, produce an exhaustive OpenAPI 3.1 specification including rate limiting, GraphQL federation alternatives, gRPC bindings, multi-region failover, OAuth2 scopes, and a 20-page architectural decision record.",
    weakOutput: "POST /user - creates a user, send name and email.",
    optimizedOutput: "POST /api/v1/users\nRequest: { \"email\": string, \"password\": string, \"name\": string }\nResponse 201: { \"id\": string, \"email\": string, \"name\": string, \"createdAt\": string }\nErrors: 400 Invalid input, 409 Email already exists, 500 Internal server error",
    principle: "Structural Scoping: Naming the exact artifact fields (method, path, schemas, error codes) turns an open-ended design task into a checklist the model can fill in precisely."
  },
  {
    id: 5,
    title: "Optimize a Slow SQL Query",
    desiredOutput: "An optimized SQL query with an explanation of what changed and why performance improves.",
    correctBlocks: [
      "Optimize the following SQL query for performance.",
      "Explain what changed and why it improves performance.",
      "Assume the table has millions of rows and suggest relevant indexes.",
      "Keep the query semantically identical to the original."
    ],
    distractorBlocks: [
      "Rewrite the whole database schema.",
      "Just say it looks fine without checking.",
      "Add unrelated columns to the query."
    ],
    weakPrompt: "This query is slow, fix it.",
    optimizedPrompt: "Optimize the following SQL query for performance. Explain what changed and why it improves performance. Assume the table has millions of rows and suggest relevant indexes. Keep the query semantically identical to the original.",
    overEngineeredPrompt: "As a world-renowned database performance guru, provide an exhaustive multi-vendor (PostgreSQL, MySQL, Oracle, SQL Server) optimization analysis including query execution plans, partitioning strategies, sharding topology, hardware provisioning recommendations, and a full cost-benefit financial model spanning 5000 words.",
    weakOutput: "SELECT * FROM orders WHERE status='pending' -- should be fast now",
    optimizedOutput: "SELECT id, customer_id, total FROM orders WHERE status = 'pending';\n\nChange: replaced SELECT * with explicit columns to reduce I/O, and recommend adding an index on (status) since it's the filter column. On a multi-million row table, this avoids a full table scan.",
    principle: "Constraint Preservation: Requiring semantic equivalence while asking for optimization prevents the model from 'optimizing' by silently changing query behavior — a common and dangerous failure mode."
  },
  {
    id: 6,
    title: "Write a Git Commit Message",
    desiredOutput: "A concise, conventional-commit-style message that accurately summarizes a code change.",
    correctBlocks: [
      "Write a git commit message for this change using Conventional Commits format.",
      "Summarize what changed and why in the body.",
      "Keep the subject line under 50 characters.",
      "Use present-tense, imperative mood."
    ],
    distractorBlocks: [
      "Write a 500-word essay about the change's history.",
      "Include emojis in every line.",
      "Describe unrelated future plans."
    ],
    weakPrompt: "Write a commit message.",
    optimizedPrompt: "Write a git commit message for this change using Conventional Commits format. Summarize what changed and why in the body. Keep the subject line under 50 characters. Use present-tense, imperative mood.",
    overEngineeredPrompt: "As the lead maintainer of a Fortune 500 monorepo with strict governance, generate a commit message including full changelog entry, semantic versioning impact analysis, stakeholder sign-off checklist, and a haiku summarizing the emotional journey of this refactor.",
    weakOutput: "fixed stuff",
    optimizedOutput: "fix(auth): handle expired token refresh correctly\n\nPreviously, expired tokens caused a silent failure instead of\ntriggering a refresh. This adds a check before each request and\nrefreshes the token proactively, preventing dropped sessions.",
    principle: "Format Anchoring: Naming a known convention ('Conventional Commits') gives the model an external standard to follow instead of guessing at structure and length."
  }
];

/* ============================= STATE ============================= */
let state = {
  scenarioOrder: [],
  currentIndex: 0,
  challengeTypeOrder: [],
  score: 0,
  accuracyPoints: 0,
  totalPossible: 0,
  moves: 0,
  wrongPlacements: 0,
  hintsUsed: 0,
  startTime: null,
  scenarioResults: [], // {scenarioId, challengeType, correct, hintUsed}
};

const CHALLENGE_TYPES = ["build","clean","choose"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initGame(){
  state.scenarioOrder = shuffle(SCENARIOS).slice(0, 6);
  state.currentIndex = 0;
  state.challengeTypeOrder = state.scenarioOrder.map((_,i)=> CHALLENGE_TYPES[i % CHALLENGE_TYPES.length]);
  state.challengeTypeOrder = shuffle(state.challengeTypeOrder);
  state.score = 0;
  state.moves = 0;
  state.wrongPlacements = 0;
  state.hintsUsed = 0;
  state.startTime = Date.now();
  state.scenarioResults = [];
  render();
}

/* ============================= TOASTS ============================= */
function toast(msg, bad){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 2800);
}

function scorePop(points, x, y){
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = (points>=0?'+':'') + points;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = points >= 0 ? 'var(--good)' : 'var(--bad)';
  document.body.appendChild(el);
  setTimeout(()=> el.remove(), 1000);
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.currentIndex >= state.scenarioOrder.length){
    app.innerHTML = renderReport();
    attachReportEvents();
    return;
  }
  const scenario = state.scenarioOrder[state.currentIndex];
  const ctype = state.challengeTypeOrder[state.currentIndex];
  app.innerHTML = renderHeader() + renderStatbar() + renderProgress() + renderChallenge(scenario, ctype);
  attachChallengeEvents(scenario, ctype);
}

function renderHeader(){
  return `
  <div class="header fade-in">
    <h1>🧩 Prompt Puzzle</h1>
    <p>Master AI Prompting Through Play</p>
    <div class="row" style="justify-content:center;margin-top:10px;">
      <span class="pill domain">${DOMAIN}</span>
      <span class="pill diff">${DIFFICULTY}</span>
    </div>
  </div>`;
}

function renderStatbar(){
  const elapsed = Math.floor((Date.now()-state.startTime)/1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');
  return `
  <div class="statbar fade-in">
    <div class="stat"><div class="num">${state.score}</div><div class="lbl">Score</div></div>
    <div class="stat"><div class="num">${mm}:${ss}</div><div class="lbl">Time</div></div>
    <div class="stat"><div class="num">${state.moves}</div><div class="lbl">Moves</div></div>
    <div class="stat"><div class="num">${state.wrongPlacements}</div><div class="lbl">Wrong</div></div>
    <div class="stat"><div class="num">${state.hintsUsed}</div><div class="lbl">Hints</div></div>
  </div>`;
}

function renderProgress(){
  const pct = Math.round((state.currentIndex/state.scenarioOrder.length)*100);
  return `<div class="progress-outer"><div class="progress-inner" style="width:${pct}%"></div></div>
  <p class="small" style="text-align:right;margin-top:-14px;">Scenario ${state.currentIndex+1} of ${state.scenarioOrder.length}</p>`;
}

/* ============================= CHALLENGE ROUTER ============================= */
function renderChallenge(scenario, ctype){
  if(ctype === 'build') return renderBuild(scenario);
  if(ctype === 'clean') return renderClean(scenario);
  return renderChoose(scenario);
}
function attachChallengeEvents(scenario, ctype){
  if(ctype === 'build') attachBuildEvents(scenario);
  if(ctype === 'clean') attachCleanEvents(scenario);
  if(ctype === 'choose') attachChooseEvents(scenario);
}

/* ============================= CHALLENGE 1: BUILD THE PROMPT ============================= */
function renderBuild(scenario){
  const allBlocks = shuffle(scenario.correctBlocks.concat(scenario.distractorBlocks));
  window.__buildBlocks = allBlocks;
  return `
  <div class="card fade-in">
    <span class="tag">BUILD THE PROMPT</span>
    <h2>${scenario.title}</h2>
    <p class="muted">Desired Output: ${scenario.desiredOutput}</p>
    <h3>🧱 Available Blocks (drag into the zone below)</h3>
    <div class="blocks-zone" id="pool">
      ${allBlocks.map((b,i)=>`<div class="block" draggable="true" data-idx="${i}" data-text="${escapeAttr(b)}">${b}</div>`).join('')}
    </div>
    <h3>🎯 Your Prompt (drop correct blocks here, in order)</h3>
    <div class="blocks-zone" id="dropzone" style="min-height:100px;"></div>
    <div class="row space-between" style="margin-top:16px;">
      <button class="btn secondary" id="hintBtn">💡 Hint (-15 pts)</button>
      <button class="btn" id="checkBtn">Check Prompt ✅</button>
    </div>
    <div id="hintArea"></div>
  </div>`;
}

function attachBuildEvents(scenario){
  const pool = document.getElementById('pool');
  const dropzone = document.getElementById('dropzone');
  let dragged = null;

  function addDragListeners(container){
    container.querySelectorAll('.block').forEach(block=>{
      block.addEventListener('dragstart', e=>{
        dragged = block;
        block.classList.add('dragging');
      });
      block.addEventListener('dragend', ()=> block.classList.remove('dragging'));
    });
  }
  addDragListeners(pool);

  [pool, dropzone].forEach(zone=>{
    zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('over');
      if(dragged){
        zone.appendChild(dragged);
        state.moves++;
        document.getElementById('pool') && renderStatInline();
      }
    });
  });

  function renderStatInline(){
    const sb = document.querySelector('.statbar');
    if(sb) sb.outerHTML = renderStatbar();
  }

  document.getElementById('hintBtn').addEventListener('click', ()=>{
    state.hintsUsed++;
    state.score = Math.max(0, state.score - 15);
    document.getElementById('hintArea').innerHTML = `<div class="hint-box">💡 Hint: ${scenario.principle}</div>`;
    render_soft_update();
  });

  document.getElementById('checkBtn').addEventListener('click', (e)=>{
    const placed = Array.from(dropzone.querySelectorAll('.block')).map(b=> b.dataset.text);
    const correctSet = scenario.correctBlocks;
    let correctCount = 0;
    Array.from(dropzone.querySelectorAll('.block')).forEach(b=>{
      const isCorrect = correctSet.includes(b.dataset.text);
      if(isCorrect){ b.classList.add('correct-flash'); correctCount++; }
      else { b.classList.add('wrong-flash'); state.wrongPlacements++; }
    });
    const accuracy = correctCount / correctSet.length;
    const missedNone = placed.length === correctSet.length && correctCount === correctSet.length;
    let pts = Math.round(accuracy * 100);
    if(missedNone) pts += 20; // optimization bonus for exact match
    pts -= state.wrongPlacements * 2;
    pts = Math.max(0, pts);
    state.score += pts;
    scorePop(pts, e.clientX, e.clientY);
    toast(missedNone ? "Perfect prompt assembly! 🎉" : `Accuracy: ${Math.round(accuracy*100)}%`, !missedNone && accuracy < 0.5);
    state.scenarioResults.push({scenarioId:scenario.id, challengeType:'build', correct: missedNone, hintUsed: state.hintsUsed>0});
    setTimeout(()=>{ state.currentIndex++; render(); }, 1300);
  });

  function render_soft_update(){
    const sb = document.querySelector('.statbar');
    if(sb) sb.outerHTML = renderStatbar();
  }
}

/* ============================= CHALLENGE 2: CLEAN THE PROMPT ============================= */
function renderClean(scenario){
  const combined = shuffle(scenario.correctBlocks.map(b=>({text:b, keep:true}))
    .concat(scenario.distractorBlocks.map(b=>({text:b, keep:false}))));
  window.__cleanBlocks = combined;
  return `
  <div class="card fade-in">
    <span class="tag">CLEAN THE PROMPT</span>
    <h2>${scenario.title}</h2>
    <p class="muted">Desired Output: ${scenario.desiredOutput}</p>
    <h3>🧹 This prompt has extra junk mixed in. Click blocks to REMOVE the ones that don't belong.</h3>
    <div class="blocks-zone" id="cleanZone">
      ${combined.map((item,i)=>`<div class="block" data-idx="${i}" data-keep="${item.keep}">${item.text}</div>`).join('')}
    </div>
    <div class="row space-between" style="margin-top:16px;">
      <button class="btn secondary" id="hintBtn2">💡 Hint (-15 pts)</button>
      <button class="btn" id="submitClean">Submit Cleaned Prompt ✅</button>
    </div>
    <div id="hintArea2"></div>
  </div>`;
}

function attachCleanEvents(scenario){
  const zone = document.getElementById('cleanZone');
  zone.querySelectorAll('.block').forEach(block=>{
    block.addEventListener('click', ()=>{
      block.classList.toggle('wrong-flash');
      block.dataset.removed = block.classList.contains('wrong-flash') ? 'true' : 'false';
      state.moves++;
    });
  });
  document.getElementById('hintBtn2').addEventListener('click', ()=>{
    state.hintsUsed++;
    state.score = Math.max(0, state.score - 15);
    document.getElementById('hintArea2').innerHTML = `<div class="hint-box">💡 Hint: ${scenario.principle}</div>`;
  });
  document.getElementById('submitClean').addEventListener('click', (e)=>{
    let correctActions = 0;
    const total = zone.querySelectorAll('.block').length;
    zone.querySelectorAll('.block').forEach(block=>{
      const shouldKeep = block.dataset.keep === 'true';
      const wasRemoved = block.dataset.removed === 'true';
      const correctAction = (shouldKeep && !wasRemoved) || (!shouldKeep && wasRemoved);
      if(correctAction){ correctActions++; block.classList.add('correct-flash'); }
      else { state.wrongPlacements++; }
    });
    const accuracy = correctActions/total;
    let pts = Math.round(accuracy*100) - (state.wrongPlacements*2);
    if(accuracy === 1) pts += 20;
    pts = Math.max(0,pts);
    state.score += pts;
    scorePop(pts, e.clientX, e.clientY);
    toast(accuracy===1 ? "Immaculate clean! 🧼" : `Accuracy: ${Math.round(accuracy*100)}%`, accuracy<0.5);
    state.scenarioResults.push({scenarioId:scenario.id, challengeType:'clean', correct: accuracy===1, hintUsed: state.hintsUsed>0});
    setTimeout(()=>{ state.currentIndex++; render(); }, 1300);
  });
}

/* ============================= CHALLENGE 3: CHOOSE THE BEST PROMPT ============================= */
function renderChoose(scenario){
  const choices = shuffle([
    {label:'Weak Prompt', text: scenario.weakPrompt, type:'weak'},
    {label:'Optimized Prompt', text: scenario.optimizedPrompt, type:'optimal'},
    {label:'Over-Engineered Prompt', text: scenario.overEngineeredPrompt, type:'over'}
  ]);
  window.__chooseData = choices;
  return `
  <div class="card fade-in">
    <span class="tag">CHOOSE THE BEST PROMPT</span>
    <h2>${scenario.title}</h2>
    <p class="muted">Desired Output: ${scenario.desiredOutput}</p>
    <h3>🎯 Pick the prompt most likely to reliably produce the desired output</h3>
    <div id="choiceList">
      ${choices.map((c,i)=>`<div class="choice-card" data-idx="${i}" data-type="${c.type}">${escapeHtml(c.text)}</div>`).join('')}
    </div>
    <div class="row space-between" style="margin-top:16px;">
      <button class="btn secondary" id="hintBtn3">💡 Hint (-15 pts)</button>
      <button class="btn" id="submitChoose" disabled>Confirm Choice ✅</button>
    </div>
    <div id="hintArea3"></div>
  </div>`;
}

function attachChooseEvents(scenario){
  let selected = null;
  const list = document.getElementById('choiceList');
  const submitBtn = document.getElementById('submitChoose');
  list.querySelectorAll('.choice-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      list.querySelectorAll('.choice-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selected = card;
      submitBtn.disabled = false;
      state.moves++;
    });
  });
  document.getElementById('hintBtn3').addEventListener('click', ()=>{
    state.hintsUsed++;
    state.score = Math.max(0, state.score - 15);
    document.getElementById('hintArea3').innerHTML = `<div class="hint-box">💡 Hint: ${scenario.principle}</div>`;
  });
  submitBtn.addEventListener('click', (e)=>{
    const isCorrect = selected.dataset.type === 'optimal';
    list.querySelectorAll('.choice-card').forEach(c=>{
      if(c.dataset.type === 'optimal') c.classList.add('correct');
      else if(c === selected) c.classList.add('incorrect');
    });
    if(!isCorrect) state.wrongPlacements++;
    let pts = isCorrect ? 100 : 20;
    if(isCorrect) pts += 20;
    state.score += pts;
    scorePop(pts, e.clientX, e.clientY);
    toast(isCorrect ? "Excellent judgment! 🎯" : "Not quite — check the principle below.", !isCorrect);
    state.scenarioResults.push({scenarioId:scenario.id, challengeType:'choose', correct:isCorrect, hintUsed: state.hintsUsed>0});
    submitBtn.disabled = true;
    setTimeout(()=>{ state.currentIndex++; render(); }, 1400);
  });
}

/* ============================= REPORT ============================= */
function renderReport(){
  const totalScenarios = state.scenarioResults.length;
  const correctCount = state.scenarioResults.filter(r=>r.correct).length;
  const accuracyPct = totalScenarios? Math.round((correctCount/totalScenarios)*100) : 0;
  const elapsed = Math.floor((Date.now()-state.startTime)/1000);
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
  const ss = String(elapsed%60).padStart(2,'0');

  let rank = "Prompt Novice";
  if(state.score >= 550) rank = "Prompt Grandmaster";
  else if(state.score >= 420) rank = "Prompt Architect";
  else if(state.score >= 300) rank = "Prompt Engineer";
  else if(state.score >= 180) rank = "Prompt Apprentice";

  let rating = "Needs Practice";
  if(accuracyPct >= 90) rating = "Outstanding";
  else if(accuracyPct >= 70) rating = "Strong";
  else if(accuracyPct >= 50) rating = "Developing";

  // Prompt DNA: distribution across principle-driven traits based on challenge types played
  const buildCount = state.scenarioResults.filter(r=>r.challengeType==='build').length;
  const cleanCount = state.scenarioResults.filter(r=>r.challengeType==='clean').length;
  const chooseCount = state.scenarioResults.filter(r=>r.challengeType==='choose').length;
  const total = Math.max(1, buildCount+cleanCount+chooseCount);
  const dna = [
    {label:'Structure', value: Math.round((buildCount/total)*100), color:'#7c5cff'},
    {label:'Precision', value: Math.round((cleanCount/total)*100), color:'#37e0d0'},
    {label:'Judgment', value: Math.round((chooseCount/total)*100), color:'#ffb84d'}
  ];

  const nextMilestone = state.score < 300 ? "Reach 300 points to unlock 'Prompt Engineer' rank"
    : state.score < 420 ? "Reach 420 points to unlock 'Prompt Architect' rank"
    : state.score < 550 ? "Reach 550 points to unlock 'Prompt Grandmaster' rank"
    : "You've reached the top rank — try a harder difficulty next!";

  const finalOptimized = state.scenarioOrder[0] ? state.scenarioOrder[0].optimizedPrompt : "";

  const feedback = accuracyPct >= 90
    ? "You consistently identify the exact constraints a prompt needs — no more, no less. That's the hallmark of professional prompt engineering."
    : accuracyPct >= 70
    ? "Solid instincts. You're good at spotting core requirements; tighten up on distinguishing 'helpful detail' from 'unnecessary bloat'."
    : accuracyPct >= 50
    ? "You're building the right foundation. Focus on why each block matters — re-read the Prompt Principle after each round."
    : "Keep practicing! Try using the hints more often — they explain the reasoning, not just the answer.";

  return `
  <div class="header fade-in">
    <h1>📊 Prompt Performance Report</h1>
    <p>${DOMAIN} • ${DIFFICULTY}</p>
  </div>
  <div class="card report-hero fade-in">
    <div class="rank">${rank}</div>
    <p class="muted">${rating} · ${accuracyPct}% Accuracy</p>
    <div class="statbar" style="margin-top:18px;">
      <div class="stat"><div class="num">${state.score}</div><div class="lbl">Prompt Score</div></div>
      <div class="stat"><div class="num">${mm}:${ss}</div><div class="lbl">Time</div></div>
      <div class="stat"><div class="num">${state.moves}</div><div class="lbl">Moves</div></div>
      <div class="stat"><div class="num">${state.wrongPlacements}</div><div class="lbl">Wrong Placements</div></div>
      <div class="stat"><div class="num">${state.hintsUsed}</div><div class="lbl">Hints Used</div></div>
    </div>
  </div>
  <div class="card fade-in">
    <h2>🧬 Prompt DNA</h2>
    <p class="muted">Your strengths across the three prompting disciplines</p>
    <div class="dna-bar">
      ${dna.map(d=>`<div class="dna-seg" style="width:${Math.max(d.value,8)}%;background:${d.color};">${d.label} ${d.value}%</div>`).join('')}
    </div>
  </div>
  <div class="grid">
    <div class="card fade-in">
      <h2>💬 Personalized Feedback</h2>
      <p>${feedback}</p>
      <h3>🎯 Next Milestone</h3>
      <p class="muted">${nextMilestone}</p>
    </div>
    <div class="card fade-in">
      <h2>✨ Final Optimized Prompt Example</h2>
      <div class="output-box">${escapeHtml(finalOptimized)}</div>
    </div>
  </div>
  <div class="card fade-in" style="text-align:center;">
    <button class="btn" id="replayBtn">🔁 Play Again (New Scenarios)</button>
  </div>`;
}

function attachReportEvents(){
  document.getElementById('replayBtn').addEventListener('click', initGame);
}

/* ============================= HELPERS ============================= */
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){
  return str.replace(/"/g,'&quot;');
}

/* live timer update */
setInterval(()=>{
  if(state.currentIndex < state.scenarioOrder.length){
    const sb = document.querySelector('.statbar');
    if(sb) sb.outerHTML = renderStatbar();
  }
}, 1000);

initGame();
</script>
</body>
</html>
