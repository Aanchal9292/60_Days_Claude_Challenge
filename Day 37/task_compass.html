<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Compass — Startup Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0f0e17; --bg2:#161426; --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --violet:#7c5cfc; --coral:#ff6b6b; --mint:#4ecdc4; --amber:#ffb84d;
  --sky:#5cc8ff; --rose:#ff8fd0; --lime:#b6f169;
  --text:#f1eefc; --sub:#a9a4c4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(124,92,252,0.25), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(255,107,107,0.18), transparent 45%),
    linear-gradient(160deg, var(--bg), var(--bg2));
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px;}
header.top{text-align:center;margin-bottom:22px;}
.brand{
  font-size:2.1rem; font-weight:800; letter-spacing:-0.02em;
  background:linear-gradient(90deg,var(--violet),var(--coral),var(--amber));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:200% auto; animation:shine 6s linear infinite;
}
@keyframes shine{0%{background-position:0% center;}100%{background-position:200% center;}}
.subtitle{color:var(--sub); font-size:0.95rem; margin-top:4px;}

.progress-row{display:flex; gap:8px; justify-content:center; margin:20px 0 8px;}
.progress-dot{width:34px;height:6px;border-radius:4px;background:var(--border);transition:.4s;}
.progress-dot.done{background:var(--mint);}
.progress-dot.active{background:var(--violet); box-shadow:0 0 12px var(--violet);}
.stage-label{text-align:center;color:var(--sub);font-size:0.85rem;margin-bottom:20px;}

.card-panel{
  background:var(--glass); border:1px solid var(--border);
  border-radius:20px; padding:26px; backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,0.35);
  animation:fadeIn .5s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.ticket{
  background:linear-gradient(135deg, rgba(124,92,252,0.16), rgba(255,255,255,0.03));
  border:1px dashed rgba(124,92,252,0.5);
  border-radius:14px; padding:18px 20px; margin-bottom:22px;
  position:relative;
}
.ticket:before{
  content:"TICKET"; position:absolute; top:-10px; left:16px;
  background:var(--violet); color:#fff; font-size:0.65rem; font-weight:700;
  padding:2px 10px; border-radius:8px; letter-spacing:.08em;
}
.ticket-text{font-size:1.05rem; line-height:1.5;}

.slot-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin:18px 0;}
.slot{
  min-width:140px; min-height:78px; flex:1;
  border:2px dashed var(--border); border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:0.85rem; text-align:center; padding:8px;
  transition:.25s;
}
.slot.highlight{border-color:var(--amber); box-shadow:0 0 18px rgba(255,184,77,0.25);}
.slot.over{background:rgba(255,184,77,0.14); transform:scale(1.03);}
.slot.filled{border-style:solid; border-color:var(--mint);}
.slot .placed-card{margin:0;}

.role-grid{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:18px;}
.role-card{
  cursor:grab; user-select:none;
  width:130px; padding:14px 10px; border-radius:14px;
  background:var(--card-color, var(--violet));
  color:#0f0e17; font-weight:700; font-size:0.85rem; text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.3);
  transition:transform .18s, box-shadow .18s;
  border:2px solid rgba(255,255,255,0.25);
}
.role-card .emoji{font-size:1.6rem; display:block; margin-bottom:4px;}
.role-card:hover{transform:translateY(-4px) scale(1.04); box-shadow:0 10px 22px rgba(0,0,0,0.4);}
.role-card.dragging{opacity:0.4;}
.role-card.used{opacity:0.25; pointer-events:none;}
.role-card.placed-card{cursor:default; width:auto; min-width:110px;}

.route-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; margin:18px 0;}
.route-slot{
  min-width:110px;min-height:70px; border:2px dashed var(--border); border-radius:12px;
  display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:0.8rem;
  position:relative;
}
.route-slot.filled{border-style:solid; border-color:var(--sky);}
.arrow{font-size:1.4rem; color:var(--sub);}

.btn{
  border:none; border-radius:12px; padding:12px 26px; font-weight:700; cursor:pointer;
  background:linear-gradient(90deg,var(--violet),var(--coral)); color:#fff; font-size:0.95rem;
  transition:.2s; display:block; margin:22px auto 4px;
}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.btn:not(:disabled):hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(124,92,252,0.4);}
.btn.secondary{background:var(--glass); border:1px solid var(--border); color:var(--text);}

.reveal{
  margin-top:20px; padding:18px 20px; border-radius:14px;
  background:rgba(78,205,196,0.1); border:1px solid rgba(78,205,196,0.35);
  animation:fadeIn .5s ease;
}
.reveal h4{margin:0 0 6px; color:var(--mint);}
.reveal p{margin:6px 0; color:var(--text); font-size:0.92rem; line-height:1.5;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
.tag{background:rgba(255,255,255,0.08); padding:4px 10px; border-radius:20px; font-size:0.75rem;}

.multi-grid{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:16px 0;}
.multi-card{
  cursor:pointer; width:135px; padding:14px 10px; border-radius:14px;
  background:var(--card-color, var(--violet)); color:#0f0e17; font-weight:700;
  font-size:0.85rem; text-align:center; border:3px solid transparent; transition:.2s;
}
.multi-card.selected{border-color:#fff; transform:translateY(-4px) scale(1.05); box-shadow:0 0 0 3px rgba(255,255,255,0.25);}
.multi-card .emoji{font-size:1.6rem;display:block;margin-bottom:4px;}
.counter{text-align:center; color:var(--sub); font-size:0.85rem; margin-top:6px;}

.chart-wrap{display:flex; flex-direction:column; gap:14px; margin:20px 0;}
.bar-row{display:flex; align-items:center; gap:10px;}
.bar-label{width:140px; font-size:0.85rem; color:var(--sub);}
.bar-track{flex:1; height:16px; background:rgba(255,255,255,0.06); border-radius:10px; overflow:hidden;}
.bar-fill{height:100%; border-radius:10px; width:0%; transition:width 1.1s cubic-bezier(.2,.9,.3,1);}
.bar-val{width:36px; text-align:right; font-size:0.8rem; color:var(--sub);}

.celebration{
  text-align:center; font-size:2.4rem; margin:8px 0; animation:pop .6s ease;
}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.2);}100%{transform:scale(1);}}

.reflect-block{
  background:var(--glass); border:1px solid var(--border); border-radius:14px;
  padding:16px 18px; margin-bottom:12px;
}
.reflect-block h4{margin:0 0 6px; color:var(--amber);}
.reflect-block p{margin:0; color:var(--text); font-size:0.9rem; line-height:1.5;}

.moving-ticket{
  position:relative; height:60px; margin:20px 0;
  background:rgba(255,255,255,0.04); border-radius:12px; overflow:hidden;
}
.moving-ticket .mover{
  position:absolute; top:14px; left:0; font-size:1.8rem;
  transition: left 2.2s cubic-bezier(.2,.8,.3,1);
}
.track-line{position:absolute; top:30px; left:0; right:0; height:2px; background:var(--border);}

@media (max-width:600px){
  .brand{font-size:1.6rem;}
  .role-card, .multi-card{width:110px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">🧭 Task Compass</div>
    <div class="subtitle">Learn how work flows through real organizations.</div>
    <div class="subtitle" style="opacity:.7">Workplace: Startup</div>
  </header>

  <div class="progress-row" id="progressRow"></div>
  <div class="stage-label" id="stageLabel"></div>

  <div id="app"></div>
</div>

<script>
/* ---------------- DATA ---------------- */

const ROLES = [
  {id:'founder', name:'Founder / CEO', emoji:'🚀', color:'#ffb84d'},
  {id:'pm', name:'Product Manager', emoji:'🗺️', color:'#5cc8ff'},
  {id:'eng', name:'Engineer (Full-stack)', emoji:'💻', color:'#7c5cfc'},
  {id:'design', name:'Designer', emoji:'🎨', color:'#ff8fd0'},
  {id:'growth', name:'Growth / Marketing', emoji:'📈', color:'#4ecdc4'},
  {id:'sales', name:'Sales', emoji:'🤝', color:'#ff6b6b'},
  {id:'support', name:'Customer Support', emoji:'💬', color:'#b6f169'},
  {id:'ops', name:'Operations', emoji:'⚙️', color:'#a9a4c4'},
];
const roleById = id => ROLES.find(r=>r.id===id);

// STAGE 1: Who owns this? (single owner + assists)
const STAGE1 = [
  {
    text:"A customer reports the checkout button does nothing on Safari.",
    owner:'eng', assist:['pm','support'],
    why:"Engineering owns the technical fix since it's a bug in the code. Support surfaces the report clearly, and the PM tracks it against priorities.",
  },
  {
    text:"Three users in a row cancel their subscription and mention 'too expensive'.",
    owner:'pm', assist:['founder','growth'],
    why:"The Product Manager owns understanding the pattern behind cancellations and deciding whether pricing or value needs to change. The founder weighs in on strategy, and growth watches broader retention trends.",
  },
  {
    text:"The onboarding flow looks confusing and new signups drop off after step 2.",
    owner:'design', assist:['pm','eng'],
    why:"The Designer owns the experience and flow of onboarding. The PM defines what 'success' at each step means, and engineering implements any changes.",
  },
  {
    text:"A journalist emails asking for a comment about the company's new feature.",
    owner:'founder', assist:['growth'],
    why:"External-facing statements about company direction sit with the Founder/CEO, since they represent the company's voice. Growth/marketing helps shape the message.",
  },
  {
    text:"A big prospective client asks for a custom contract with unusual payment terms.",
    owner:'sales', assist:['founder','ops'],
    why:"Sales owns the relationship and negotiation. The founder may need to approve unusual terms, and operations checks that the terms are workable to fulfill.",
  },
  {
    text:"The server bill just doubled overnight with no clear reason.",
    owner:'eng', assist:['ops','founder'],
    why:"Engineering investigates technical causes like a bug or infinite loop. Operations tracks the cost impact, and the founder is informed given the budget implication.",
  },
  {
    text:"A support ticket keeps getting asked by many users: 'how do I export my data?'",
    owner:'support', assist:['pm','design'],
    why:"Support owns day-to-day customer questions and can often answer directly. If it's a recurring pain point, they flag it to the PM and designer to consider a product fix.",
  },
  {
    text:"A competitor just launched a feature very similar to one your team is planning.",
    owner:'pm', assist:['founder','design'],
    why:"The PM owns reassessing the roadmap given new market information. The founder weighs strategic response, and design considers if differentiation is needed.",
  },
];

// STAGE 2: Task Routing (ordered workflow)
const STAGE2 = [
  {
    text:"A user reports a bug where uploaded images don't save.",
    order:['support','eng','pm'],
    why:"Support first captures the report and reproduces details from the customer. Engineering diagnoses and fixes the bug. The PM confirms the fix resolves the underlying need and closes the loop.",
  },
  {
    text:"Marketing wants to launch a limited-time discount campaign.",
    order:['growth','pm','eng','ops'],
    why:"Growth proposes the campaign idea. The PM checks it fits product plans and pricing logic. Engineering implements any needed discount code/logic. Operations confirms it won't break billing or fulfillment.",
  },
  {
    text:"A new feature idea comes from a customer interview.",
    order:['pm','design','eng','support'],
    why:"The PM captures and scopes the idea from research. Design shapes the experience. Engineering builds it. Support is looped in last so they can help existing customers who asked for it.",
  },
  {
    text:"The team wants to raise prices for new customers.",
    order:['founder','pm','sales','growth'],
    why:"The founder sets overall pricing strategy. The PM works out how pricing tiers should change. Sales adjusts how deals are pitched. Growth updates marketing materials to reflect the new pricing.",
  },
];

// STAGE 3: Collaboration challenge (multi-select)
const STAGE3 = [
  {
    text:"Customer satisfaction suddenly drops across the board.",
    primary:'pm',
    correct:['pm','support','design','eng'],
    reasoning:"The PM leads the investigation into root causes. Support provides first-hand accounts of what users are frustrated by. Design checks if a recent UI change hurt usability. Engineering checks for bugs or slowdowns.",
    flow:"Support → PM (patterns) → Design & Engineering (root cause) → PM (synthesis) → Founder (update)",
  },
  {
    text:"Sales increase dramatically after a surprise mention on social media.",
    primary:'ops',
    correct:['ops','eng','support','growth'],
    reasoning:"Operations makes sure the business can handle the surge (payments, fulfillment, capacity). Engineering watches for the servers holding up under load. Support prepares for a wave of new-user questions. Growth capitalizes on the momentum.",
    flow:"Growth (spots the spike) → Ops & Engineering (can we handle it?) → Support (prepare) → Founder (celebrate + plan)",
  },
  {
    text:"Negative reviews appear online criticizing the product's reliability.",
    primary:'founder',
    correct:['founder','eng','support','growth'],
    reasoning:"The founder owns the company's public response and tone. Engineering addresses the underlying reliability issues. Support follows up directly with affected customers. Growth monitors sentiment and helps shape messaging.",
    flow:"Growth (flags the reviews) → Founder (response strategy) → Engineering (fix) → Support (personal follow-up)",
  },
  {
    text:"A major feature is delayed by several weeks right before a big launch event.",
    primary:'pm',
    correct:['pm','eng','founder','growth'],
    reasoning:"The PM reassesses scope and options. Engineering gives an honest estimate of what's really achievable. The founder decides whether to delay the event or adjust the announcement. Growth adjusts messaging and external expectations.",
    flow:"Engineering (raises the delay) → PM (options) → Founder (decision) → Growth (updates messaging)",
  },
];

/* ---------------- STATE ---------------- */
let stage = 1; // 1,2,3, or 'results'
let qIndex = 0;
let scores = {ownership:0, delegation:0, collaboration:0, workflow:0};
let maxScores = {ownership:9, delegation:9, collaboration:9, workflow:9};
let overAssignCount = 0, underAssignCount = 0;
let stage1Data = shuffle(STAGE1).slice(0,3);
let stage2Data = shuffle(STAGE2).slice(0,3);
let stage3Data = shuffle(STAGE3).slice(0,3);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const app = document.getElementById('app');
const progressRow = document.getElementById('progressRow');
const stageLabel = document.getElementById('stageLabel');

function updateProgress(){
  progressRow.innerHTML = '';
  const totalDots = 9;
  let doneCount = 0;
  if(stage===1) doneCount = qIndex;
  else if(stage===2) doneCount = 3+qIndex;
  else if(stage===3) doneCount = 6+qIndex;
  else doneCount = 9;
  for(let i=0;i<totalDots;i++){
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i<doneCount ? ' done' : (i===doneCount ? ' active':''));
    progressRow.appendChild(dot);
  }
  const labels = {1:'Stage 1 — Who Owns This?', 2:'Stage 2 — Task Routing', 3:'Stage 3 — Collaboration Challenge', results:'Results'};
  stageLabel.textContent = labels[stage] + (stage!=='results' ? ` · Question ${qIndex+1} of 3` : '');
}

/* ---------------- STAGE 1 RENDER ---------------- */
function renderStage1(){
  updateProgress();
  const q = stage1Data[qIndex];
  const roleSet = shuffle(ROLES);
  app.innerHTML = `
    <div class="card-panel">
      <div class="ticket"><div class="ticket-text">${q.text}</div></div>
      <div class="slot-row">
        <div class="slot highlight" id="ownerSlot">Drop the owner here</div>
      </div>
      <div class="role-grid" id="roleGrid"></div>
      <button class="btn" id="submitBtn" disabled>Submit Ownership</button>
      <div id="revealBox"></div>
    </div>
  `;
  const roleGrid = document.getElementById('roleGrid');
  const slot = document.getElementById('ownerSlot');
  const submitBtn = document.getElementById('submitBtn');
  let placedRoleId = null;

  roleSet.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'role-card';
    card.style.setProperty('--card-color', r.color);
    card.draggable = true;
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span>${r.name}`;
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', r.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('click', ()=>{ // tap-to-place for mobile/no-drag
      if(placedRoleId) return;
      placeOwner(r.id);
    });
    roleGrid.appendChild(card);
  });

  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault();
    slot.classList.remove('over');
    const roleId = e.dataTransfer.getData('text/plain');
    if(roleId) placeOwner(roleId);
  });

  function placeOwner(roleId){
    if(placedRoleId) return;
    placedRoleId = roleId;
    const r = roleById(roleId);
    slot.classList.add('filled');
    slot.innerHTML = `<div class="role-card placed-card" style="--card-color:${r.color}"><span class="emoji">${r.emoji}</span>${r.name}</div>`;
    Array.from(roleGrid.children).forEach(c=>{
      if(c.dataset.roleId === roleId) c.classList.add('used');
    });
    submitBtn.disabled = false;
  }

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    const isCorrectOwner = placedRoleId === q.owner;
    const correctRole = roleById(q.owner);
    // scoring
    scores.ownership += isCorrectOwner ? 3 : 1;
    scores.delegation += 2; // stage1 gives a base delegation credit for reasoning read
    scores.workflow += 1;
    if(!isCorrectOwner) overAssignCount++;

    const assistNames = q.assist.map(id=>roleById(id).name).join(', ');
    const box = document.getElementById('revealBox');
    box.innerHTML = `
      <div class="reveal">
        <h4>${isCorrectOwner ? '✓ Well-matched ownership' : '↻ A different owner usually leads here'}</h4>
        <p><strong>Primary Owner:</strong> ${correctRole.emoji} ${correctRole.name}</p>
        <p><strong>Why they own it:</strong> ${q.why}</p>
        <div class="tag-row"><span class="tag">May assist: ${assistNames}</span></div>
      </div>
      <button class="btn" id="nextBtn">Continue</button>
    `;
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      qIndex++;
      if(qIndex>=3){ stage=2; qIndex=0; renderStage2(); }
      else renderStage1();
    });
  });
}

/* ---------------- STAGE 2 RENDER ---------------- */
function renderStage2(){
  updateProgress();
  const q = stage2Data[qIndex];
  const steps = q.order.length;
  const roleSet = shuffle(ROLES);
  let placedOrder = new Array(steps).fill(null);

  app.innerHTML = `
    <div class="card-panel">
      <div class="ticket"><div class="ticket-text">${q.text}</div></div>
      <p style="color:var(--sub);font-size:.85rem;text-align:center;">Drag roles into the route, in the order work should flow.</p>
      <div class="route-row" id="routeRow"></div>
      <div class="role-grid" id="roleGrid2"></div>
      <button class="btn" id="submitBtn2" disabled>Submit Route</button>
      <div id="revealBox2"></div>
    </div>
  `;
  const routeRow = document.getElementById('routeRow');
  for(let i=0;i<steps;i++){
    const slot = document.createElement('div');
    slot.className = 'route-slot';
    slot.dataset.index = i;
    slot.textContent = `Step ${i+1}`;
    routeRow.appendChild(slot);
    if(i<steps-1){
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      routeRow.appendChild(arrow);
    }
  }
  const roleGrid2 = document.getElementById('roleGrid2');
  const submitBtn2 = document.getElementById('submitBtn2');

  roleSet.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'role-card';
    card.style.setProperty('--card-color', r.color);
    card.draggable = true;
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span>${r.name}`;
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', r.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('click', ()=>{
      const firstEmpty = placedOrder.findIndex(v=>v===null);
      if(firstEmpty === -1 || card.classList.contains('used')) return;
      placeInSlot(firstEmpty, r.id, card);
    });
    roleGrid2.appendChild(card);
  });

  Array.from(routeRow.querySelectorAll('.route-slot')).forEach(slotEl=>{
    slotEl.addEventListener('dragover', e=>{ e.preventDefault(); slotEl.classList.add('over'); });
    slotEl.addEventListener('dragleave', ()=> slotEl.classList.remove('over'));
    slotEl.addEventListener('drop', e=>{
      e.preventDefault();
      slotEl.classList.remove('over');
      const roleId = e.dataTransfer.getData('text/plain');
      const idx = parseInt(slotEl.dataset.index,10);
      if(!roleId || placedOrder[idx]) return;
      const card = roleGrid2.querySelector(`[data-role-id="${roleId}"]`);
      if(card && card.classList.contains('used')) return;
      placeInSlot(idx, roleId, card);
    });
  });

  function placeInSlot(idx, roleId, cardEl){
    placedOrder[idx] = roleId;
    const r = roleById(roleId);
    const slotEl = routeRow.querySelector(`.route-slot[data-index="${idx}"]`);
    slotEl.classList.add('filled');
    slotEl.innerHTML = `<div class="role-card placed-card" style="--card-color:${r.color}"><span class="emoji">${r.emoji}</span>${r.name}</div>`;
    if(cardEl) cardEl.classList.add('used');
    if(placedOrder.every(v=>v!==null)) submitBtn2.disabled = false;
  }

  submitBtn2.addEventListener('click', ()=>{
    submitBtn2.disabled = true;
    let matches = 0;
    for(let i=0;i<steps;i++) if(placedOrder[i]===q.order[i]) matches++;
    const pct = matches/steps;
    scores.workflow += Math.round(pct*3)+1;
    scores.delegation += 2;
    scores.ownership += 1;
    if(pct<0.5) underAssignCount++;

    const correctChain = q.order.map(id=>{const r=roleById(id); return `${r.emoji} ${r.name}`;}).join(' → ');
    const box = document.getElementById('revealBox2');
    box.innerHTML = `
      <div class="reveal">
        <h4>${pct===1 ? '✓ That route matches how this usually flows' : '↻ A common route looks a little different'}</h4>
        <p><strong>Typical flow:</strong> ${correctChain}</p>
        <p><strong>Why this order:</strong> ${q.why}</p>
      </div>
      <div class="moving-ticket" id="mover">
        <div class="track-line"></div>
        <div class="mover">🎫</div>
      </div>
      <button class="btn" id="nextBtn2">Continue</button>
    `;
    // animate ticket travel
    setTimeout(()=>{
      const moverEl = document.querySelector('#mover .mover');
      if(moverEl) moverEl.style.left = 'calc(100% - 30px)';
    }, 150);
    document.getElementById('nextBtn2').addEventListener('click', ()=>{
      qIndex++;
      if(qIndex>=3){ stage=3; qIndex=0; renderStage3(); }
      else renderStage2();
    });
  });
}

/* ---------------- STAGE 3 RENDER ---------------- */
function renderStage3(){
  updateProgress();
  const q = stage3Data[qIndex];
  const roleSet = shuffle(ROLES);
  let selected = [];

  app.innerHTML = `
    <div class="card-panel">
      <div class="ticket"><div class="ticket-text">${q.text}</div></div>
      <p style="color:var(--sub);font-size:.85rem;text-align:center;">Select up to 4 roles who should be involved.</p>
      <div class="multi-grid" id="multiGrid"></div>
      <div class="counter" id="counter">0 / 4 selected</div>
      <button class="btn" id="submitBtn3" disabled>Submit Team</button>
      <div id="revealBox3"></div>
    </div>
  `;
  const multiGrid = document.getElementById('multiGrid');
  const counter = document.getElementById('counter');
  const submitBtn3 = document.getElementById('submitBtn3');

  roleSet.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'multi-card';
    card.style.setProperty('--card-color', r.color);
    card.dataset.roleId = r.id;
    card.innerHTML = `<span class="emoji">${r.emoji}</span>${r.name}`;
    card.addEventListener('click', ()=>{
      if(card.classList.contains('selected')){
        card.classList.remove('selected');
        selected = selected.filter(id=>id!==r.id);
      } else {
        if(selected.length>=4) return;
        card.classList.add('selected');
        selected.push(r.id);
      }
      counter.textContent = `${selected.length} / 4 selected`;
      submitBtn3.disabled = selected.length===0;
    });
    multiGrid.appendChild(card);
  });

  submitBtn3.addEventListener('click', ()=>{
    submitBtn3.disabled = true;
    const overlap = selected.filter(id=>q.correct.includes(id));
    const missed = q.correct.filter(id=>!selected.includes(id));
    const extra = selected.filter(id=>!q.correct.includes(id));

    scores.collaboration += Math.min(3, overlap.length);
    scores.ownership += selected.includes(q.primary) ? 2 : 1;
    scores.delegation += Math.max(0, 3 - extra.length);
    scores.workflow += 2;

    if(extra.length > missed.length) overAssignCount++;
    if(missed.length > 0 && selected.length <= 2) underAssignCount++;

    const primaryRole = roleById(q.primary);
    const supportRoles = q.correct.filter(id=>id!==q.primary).map(id=>roleById(id).name).join(', ');

    const box = document.getElementById('revealBox3');
    box.innerHTML = `
      <div class="reveal">
        <h4>Here's how this often plays out</h4>
        <p><strong>Primary Owner:</strong> ${primaryRole.emoji} ${primaryRole.name}</p>
        <p><strong>Supporting Teams:</strong> ${supportRoles}</p>
        <p><strong>Reasoning:</strong> ${q.reasoning}</p>
        <p><strong>Possible Communication Flow:</strong> ${q.flow}</p>
      </div>
      <button class="btn" id="nextBtn3">Continue</button>
    `;
    document.getElementById('nextBtn3').addEventListener('click', ()=>{
      qIndex++;
      if(qIndex>=3){ stage='results'; renderResults(); }
      else renderStage3();
    });
  });
}

/* ---------------- RESULTS ---------------- */
function renderResults(){
  updateProgress();
  const pct = {
    ownership: Math.round(100*scores.ownership/maxScores.ownership),
    delegation: Math.round(100*scores.delegation/maxScores.delegation),
    collaboration: Math.round(100*scores.collaboration/maxScores.collaboration),
    workflow: Math.round(100*scores.workflow/maxScores.workflow),
  };
  const colorFor = {ownership:'var(--violet)', delegation:'var(--sky)', collaboration:'var(--mint)', workflow:'var(--amber)'};
  const labelFor = {ownership:'Ownership', delegation:'Delegation', collaboration:'Collaboration', workflow:'Workflow Thinking'};

  app.innerHTML = `
    <div class="card-panel">
      <div class="celebration">🎉</div>
      <h3 style="text-align:center;margin-top:0;">Understanding Snapshot</h3>
      <div class="chart-wrap" id="chartWrap"></div>
      <div id="reflectionArea" style="margin-top:22px;"></div>
      <button class="btn secondary" id="restartBtn">Play Again</button>
    </div>
  `;
  const chartWrap = document.getElementById('chartWrap');
  Object.keys(pct).forEach(key=>{
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label">${labelFor[key]}</div>
      <div class="bar-track"><div class="bar-fill" style="background:${colorFor[key]}" data-target="${pct[key]}"></div></div>
      <div class="bar-val">${pct[key]}%</div>
    `;
    chartWrap.appendChild(row);
  });
  setTimeout(()=>{
    document.querySelectorAll('.bar-fill').forEach(el=>{
      el.style.width = el.dataset.target + '%';
    });
  }, 150);

  const reflectionArea = document.getElementById('reflectionArea');
  const strongest = Object.keys(pct).reduce((a,b)=> pct[a]>=pct[b]?a:b);
  const insightPool = [
    "Many real workplace problems are solved by teams rather than individuals.",
    "Ownership often means leading the response, not doing every part of the work alone.",
    "The order work moves through an organization usually reflects who needs information before who needs to act.",
    "Escalating something isn't a failure — it's often the fastest way to get the right expertise involved.",
  ];
  const insight = insightPool[Math.floor(Math.random()*insightPool.length)];

  const understoodWell = `You tended to identify strong candidates for ${labelFor[strongest].toLowerCase()}, especially when the task pointed clearly toward one function.`;
  const overAssignText = overAssignCount>0
    ? `In a few moments, you leaned toward a different owner or a longer chain than what's typical — a sign of thinking broadly about who *could* help, even when one clear owner usually leads.`
    : `You generally matched tasks to a fairly clear, focused owner rather than spreading responsibility too widely.`;
  const underAssignText = underAssignCount>0
    ? `In some of the more complex situations, you assigned fewer collaborators than teams often bring in — it's easy to underestimate how many functions a messy problem touches.`
    : `You tended to bring in a reasonable number of collaborators on complex situations, rather than treating them as one person's job.`;

  reflectionArea.innerHTML = `
    <div class="reflect-block">
      <h4>What you understood well</h4>
      <p>${understoodWell}</p>
    </div>
    <div class="reflect-block">
      <h4>Where you tended to over-assign responsibility</h4>
      <p>${overAssignText}</p>
    </div>
    <div class="reflect-block">
      <h4>Where you underestimated collaboration</h4>
      <p>${underAssignText}</p>
    </div>
    <div class="reflect-block">
      <h4>One insight about how organizations actually work</h4>
      <p>${insight}</p>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    stage=1; qIndex=0;
    scores = {ownership:0, delegation:0, collaboration:0, workflow:0};
    overAssignCount=0; underAssignCount=0;
    stage1Data = shuffle(STAGE1).slice(0,3);
    stage2Data = shuffle(STAGE2).slice(0,3);
    stage3Data = shuffle(STAGE3).slice(0,3);
    renderStage1();
  });
}

/* ---------------- INIT ---------------- */
renderStage1();
</script>
</body>
</html>
